[pytest]
testpaths = tests
addopts = -q --strict-markers
# A hung test (seen intermittently on the macOS runner) should fail with every
# thread's stack, not hold CI until GitHub's 6-hour limit. The thread method
# works even when the hang is inside a C call such as Tk.
timeout = 120
timeout_method = thread
filterwarnings =
    error::DeprecationWarning:config
    error::DeprecationWarning:storage
