name: Build & Release

# Runs when you push a version tag (e.g. v1.0.0), or manually from the
# Actions tab (workflow_dispatch). Builds standalone apps for Windows, macOS,
# and Linux and — on a tag — attaches them to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ActiveTimeTracker-windows.exe
          - os: macos-latest
            asset: ActiveTimeTracker-macos.zip
          - os: ubuntu-latest
            asset: ActiveTimeTracker-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Generate icon
        run: python appicon.py

      # ---- build (per OS) --------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ActiveTimeTracker --icon app.ico main.py

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ActiveTimeTracker main.py

      # ---- package into a single named asset -------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ActiveTimeTracker.exe "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/ActiveTimeTracker "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/ActiveTimeTracker.app" "${{ matrix.asset }}"

      # ---- upload: always as a workflow artifact, and on a tag also
      #      attach to the Release ------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
