name: Build & Release

# Tests run on every push and pull request. Builds only run for a version tag
# (e.g. v1.0.0) or a manual dispatch — and only after the tests pass, so a
# broken release can't be published.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to create/update the Release

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tkinter needs a display; Xvfb provides a virtual one. Without it the
      # GUI tests would skip themselves and quietly cover nothing.
      - name: Install display + X libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxss1 python3-tk

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m pytest -rs --tb=short 2>&1 | tee pytest.log

      - name: Run tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -rs --tb=short 2>&1 | tee pytest.log

      # Job logs need a token to read; annotations don't. Surfacing the failing
      # test names here makes a red build diagnosable from the API alone.
      - name: Surface failing tests
        if: failure()
        shell: bash
        run: |
          grep -E '^(FAILED|ERROR)' pytest.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true

  build:
    needs: test          # never publish something that failed its tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ActiveTimeTracker-windows.exe
          - os: macos-latest
            asset: ActiveTimeTracker-macos.zip
          - os: ubuntu-latest
            asset: ActiveTimeTracker-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Generate icon
        run: python appicon.py

      # ---- build (per OS) --------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ActiveTimeTracker --icon app.ico main.py

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ActiveTimeTracker main.py

      # ---- package into a single named asset -------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ActiveTimeTracker.exe "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/ActiveTimeTracker "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/ActiveTimeTracker.app" "${{ matrix.asset }}"

      # ---- upload: always as a workflow artifact, and on a tag also
      #      attach to the Release ------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
